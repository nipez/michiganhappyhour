// ================ COMPONENTS ================

function StarRating({ rating }) {
  return (
    <span style={{color:"#D4874E",fontSize:12,letterSpacing:0.5}}>
      {"★".repeat(Math.floor(rating))}
      <span style={{color:"#ddd"}}>{"★".repeat(5-Math.floor(rating))}</span>
      <span style={{color:"#8B7355",marginLeft:3,fontSize:11}}>{rating}</span>
    </span>
  );
}

function Badge({ children, color="#7B4F3A", bg="#F5EDE3" }) {
  return <span style={{display:"inline-block",padding:"3px 9px",borderRadius:20,fontSize:10,fontWeight:600,color,background:bg,letterSpacing:0.3,whiteSpace:"nowrap"}}>{children}</span>;
}

function ListingCard({ listing, isToday }) {
  const [expanded, setExpanded] = useState(false);
  const reg = REGIONS.find(r => r.id === listing.region);

  const handleDirections = useCallback((e) => {
    e.stopPropagation();
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(listing.name + " " + listing.address + " " + listing.town + " MI")}`, "_blank");
  }, [listing]);

  const handleCall = useCallback((e) => {
    e.stopPropagation();
    if(listing.phone) window.location.href = `tel:${listing.phone}`;
  }, [listing]);

  return (
    <div onClick={() => setExpanded(!expanded)} style={{
      background:"#fff",borderRadius:14,overflow:"hidden",cursor:"pointer",
      border:listing.featured&&isToday?"2px solid #C4895C":"1px solid #E8DFD4",
      boxShadow:expanded?"0 8px 30px rgba(123,79,58,0.12)":"0 2px 8px rgba(123,79,58,0.06)",
      transition:"all 0.25s ease",
    }}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 18px 10px"}}>
        <div style={{display:"flex",alignItems:"center",gap:11,flex:1,minWidth:0}}>
          <div style={{width:42,height:42,borderRadius:10,background:"linear-gradient(135deg,#F5EDE3,#E8DFD4)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{listing.img}</div>
          <div style={{minWidth:0}}>
            <div style={{fontWeight:700,fontSize:15,color:"#3D2B1F",lineHeight:1.2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{listing.name}</div>
            <div style={{fontSize:11,color:"#9B8B7A",marginTop:2}}>{listing.town} · {listing.address}</div>
          </div>
        </div>
        <div style={{textAlign:"right",flexShrink:0,marginLeft:12}}>
          <div style={{fontWeight:700,fontSize:13,color:isToday?"#7B4F3A":"#6B5E52",whiteSpace:"nowrap"}}>{listing.happyHour.start}–{listing.happyHour.end}</div>
          {isToday && <div style={{fontSize:9,fontWeight:700,color:"#C4895C",textTransform:"uppercase",letterSpacing:1,marginTop:2}}>Today</div>}
        </div>
      </div>
      <div style={{padding:"4px 18px 12px",display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
        <Badge>{listing.category}</Badge>
        <Badge color="#5A7B6A" bg="#E8F0EA">{listing.town}</Badge>
        {listing.happyHour.days.length===7 && <Badge color="#4A7C59" bg="#E8F0EA">7 days</Badge>}
        {listing.specials?.map((s,i) => <Badge key={i} color="#8B4513" bg="#FFF3E8">{s}</Badge>)}
        {listing.featured && <Badge color="#B8860B" bg="#FFF8E7">★ Featured</Badge>}
        <div style={{marginLeft:"auto"}}><StarRating rating={listing.rating}/></div>
      </div>
      {expanded && (
        <div style={{padding:"0 18px 16px",borderTop:"1px solid #F0E8DE"}}>
          <p style={{fontSize:13,color:"#6B5E52",fontStyle:"italic",margin:"12px 0",lineHeight:1.5}}>"{listing.vibe}"</p>
          <div style={{fontSize:10,fontWeight:700,color:"#9B8B7A",textTransform:"uppercase",letterSpacing:1.2,marginBottom:8}}>Deals & Specials</div>
          {listing.deals.map((d,i) => (
            <div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,marginBottom:4,fontSize:13,color:"#3D2B1F"}}>
              <span style={{color:"#C4895C",fontWeight:700,flexShrink:0}}>→</span>{d}
            </div>
          ))}
          <div style={{fontSize:11,color:"#9B8B7A",marginTop:10}}>
            <span style={{fontWeight:600}}>Days: </span>{listing.happyHour.days.length===7?"Every day":listing.happyHour.days.join(", ")}
          </div>
          <div style={{fontSize:11,color:"#9B8B7A",marginTop:4}}>
            <span style={{fontWeight:600}}>Region: </span>{reg?.name}
          </div>
          {listing.phone && <div style={{fontSize:11,color:"#9B8B7A",marginTop:4}}>
            <span style={{fontWeight:600}}>Phone: </span>{listing.phone}
          </div>}
          <div style={{display:"flex",gap:8,marginTop:14}}>
            <button onClick={handleCall} style={{flex:1,padding:"10px 16px",borderRadius:8,border:"1.5px solid #C4895C",background:"transparent",color:"#7B4F3A",fontWeight:600,fontSize:12,cursor:"pointer"}}>📞 Call Ahead</button>
            <button onClick={handleDirections} style={{flex:1,padding:"10px 16px",borderRadius:8,border:"none",background:"linear-gradient(135deg,#7B4F3A,#C4895C)",color:"#fff",fontWeight:600,fontSize:12,cursor:"pointer"}}>📍 Directions</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ================ MAIN APP ================

function App() {
  const [activeDay, setActiveDay] = useState(TODAY);
  const [region, setRegion] = useState("all");
  const [category, setCategory] = useState("All");
  const [search, setSearch] = useState("");
  const [sortBy, setSortBy] = useState("region");
  const [showSubmitModal, setShowSubmitModal] = useState(false);

  const filtered = useMemo(() => {
    let r = LISTINGS.filter(l => {
      return l.happyHour.days.includes(activeDay)
        && (region==="all" || l.region===region)
        && (category==="All" || l.category===category)
        && (!search || l.name.toLowerCase().includes(search.toLowerCase()) || l.town.toLowerCase().includes(search.toLowerCase()) || l.deals.some(d=>d.toLowerCase().includes(search.toLowerCase())) || l.vibe.toLowerCase().includes(search.toLowerCase()));
    });
    if(sortBy==="name") r.sort((a,b)=>a.name.localeCompare(b.name));
    else if(sortBy==="rating") r.sort((a,b)=>b.rating-a.rating);
    else if(sortBy==="time") r.sort((a,b)=>a.happyHour.start.localeCompare(b.happyHour.start));
    else r.sort((a,b)=>{const ri=REGIONS.findIndex(x=>x.id===a.region)-REGIONS.findIndex(x=>x.id===b.region);return ri!==0?ri:a.name.localeCompare(b.name);});
    return r;
  }, [activeDay,region,category,search,sortBy]);

  const regionCounts = useMemo(() => {
    const c={};
    LISTINGS.forEach(l=>{if(l.happyHour.days.includes(activeDay)){c[l.region]=(c[l.region]||0)+1;}});
    c.all=Object.values(c).reduce((a,b)=>a+b,0);
    return c;
  }, [activeDay]);

  const grouped = useMemo(() => {
    if(region!=="all"||sortBy!=="region") return null;
    const g={};
    filtered.forEach(l=>{if(!g[l.region])g[l.region]=[];g[l.region].push(l);});
    return g;
  }, [filtered,region,sortBy]);

  return (
    <div style={{background:"#FAF7F2",minHeight:"100vh"}}>
      {/* Nav */}
      <nav style={{background:"#3D2B1F",padding:"10px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:100}}>
        <a href="https://traversecitywinetour.com" style={{color:"#C4895C",fontSize:12,fontWeight:500,textDecoration:"none"}}>← Traverse City Wine Tour</a>
        <span style={{color:"#8B7355",fontSize:11}}>traversecitywinetour.com</span>
      </nav>

      {/* Hero */}
      <header style={{background:"linear-gradient(145deg,#3D2B1F 0%,#5C3D2E 60%,#7B4F3A 100%)",padding:"44px 24px 36px",textAlign:"center",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:0,left:0,right:0,bottom:0,background:"radial-gradient(ellipse at 30% 20%,rgba(196,137,92,0.15) 0%,transparent 60%)"}}/>
        <div style={{position:"relative",zIndex:1,maxWidth:640,margin:"0 auto"}}>
          <div style={{fontSize:10,fontWeight:700,color:"#C4895C",textTransform:"uppercase",letterSpacing:3,marginBottom:10}}>Northern Michigan</div>
          <h1 style={{fontSize:34,fontWeight:800,color:"#F5EDE3",margin:"0 0 8px 0",lineHeight:1.1,letterSpacing:-0.5}}>Happy Hour Guide</h1>
          <p style={{fontSize:14,color:"#BBA88E",margin:"0 0 18px 0",lineHeight:1.5}}>From Frankfort to Mackinac Island — every deal, every day.<br/>The best hour shouldn't be hard to find.</p>
          <div style={{display:"flex",justifyContent:"center",gap:16,flexWrap:"wrap"}}>
            <div style={{display:"inline-flex",alignItems:"center",gap:6,background:"rgba(255,255,255,0.1)",padding:"7px 14px",borderRadius:20}}>
              <span style={{fontSize:14}}>🥂</span><span style={{color:"#E8D5C0",fontSize:12,fontWeight:500}}>{regionCounts.all||0} spots on {activeDay}</span>
            </div>
            <div style={{display:"inline-flex",alignItems:"center",gap:6,background:"rgba(255,255,255,0.1)",padding:"7px 14px",borderRadius:20}}>
              <span style={{fontSize:14}}>📍</span><span style={{color:"#E8D5C0",fontSize:12,fontWeight:500}}>{REGIONS.length-1} regions</span>
            </div>
            <div style={{display:"inline-flex",alignItems:"center",gap:6,background:"rgba(255,255,255,0.1)",padding:"7px 14px",borderRadius:20}}>
              <span style={{fontSize:14}}>🍺</span><span style={{color:"#E8D5C0",fontSize:12,fontWeight:500}}>{LISTINGS.length} total listings</span>
            </div>
          </div>
        </div>
      </header>

      <main style={{maxWidth:680,margin:"0 auto",padding:"0 16px"}}>
        {/* Day selector */}
        <div style={{display:"flex",gap:4,padding:"18px 0 14px",overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
          {DAYS.map((day,i)=>{
            const isA=activeDay===day,isC=i===TODAY_INDEX;
            return <button key={day} onClick={()=>setActiveDay(day)} style={{padding:"8px 14px",borderRadius:20,border:"none",background:isA?"linear-gradient(135deg,#7B4F3A,#C4895C)":"#fff",color:isA?"#fff":"#6B5E52",fontWeight:isA?700:500,fontSize:12,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,boxShadow:isA?"0 2px 8px rgba(123,79,58,0.25)":"0 1px 3px rgba(0,0,0,0.06)",position:"relative"}}>
              {day.slice(0,3)}
              {isC&&!isA&&<span style={{position:"absolute",bottom:2,left:"50%",transform:"translateX(-50%)",width:4,height:4,borderRadius:"50%",background:"#C4895C"}}/>}
            </button>;
          })}
        </div>

        {/* Region grid */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:12}}>
          {REGIONS.map(r=>{
            const isA=region===r.id,cnt=regionCounts[r.id]||0;
            return <button key={r.id} onClick={()=>setRegion(r.id)} style={{padding:"10px 8px",borderRadius:10,border:isA?"2px solid #C4895C":"1px solid #E8DFD4",background:isA?"#FFF8F0":"#fff",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,transition:"all 0.15s ease"}}>
              <span style={{fontSize:16}}>{r.emoji}</span>
              <span style={{fontSize:10,fontWeight:isA?700:500,color:isA?"#7B4F3A":"#6B5E52",textAlign:"center",lineHeight:1.2}}>{r.name}</span>
              <span style={{fontSize:9,color:"#9B8B7A",fontWeight:600}}>{cnt}</span>
            </button>;
          })}
        </div>

        {/* Search & filters */}
        <div style={{background:"#fff",borderRadius:12,padding:"12px 14px",marginBottom:12,border:"1px solid #E8DFD4"}}>
          <input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search spots, towns, deals..." style={{width:"100%",padding:"10px 14px",borderRadius:8,border:"1.5px solid #E8DFD4",fontSize:14,color:"#3D2B1F",outline:"none",background:"#FAF7F2",boxSizing:"border-box",marginBottom:10}}/>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <select value={category} onChange={e=>setCategory(e.target.value)} style={{padding:"7px 12px",borderRadius:8,border:"1.5px solid #E8DFD4",fontSize:12,color:"#6B5E52",background:"#FAF7F2",cursor:"pointer",fontWeight:500}}>
              {CATEGORIES.map(c=><option key={c} value={c}>{c==="All"?"All Types":c}</option>)}
            </select>
            <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{padding:"7px 12px",borderRadius:8,border:"1.5px solid #E8DFD4",fontSize:12,color:"#6B5E52",background:"#FAF7F2",cursor:"pointer",fontWeight:500,marginLeft:"auto"}}>
              <option value="region">Sort: By Region</option>
              <option value="name">Sort: A–Z</option>
              <option value="rating">Sort: Top Rated</option>
              <option value="time">Sort: Earliest</option>
            </select>
          </div>
        </div>

        {/* Count */}
        <div style={{padding:"6px 4px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"#9B8B7A",fontWeight:500}}>
            {filtered.length} spot{filtered.length!==1?"s":""} on {activeDay}{region!=="all"?` in ${REGIONS.find(r=>r.id===region)?.name}`:""}
          </span>
          <span style={{fontSize:11,color:"#BBA88E"}}>Tap for details</span>
        </div>

        {/* Listings */}
        <div style={{display:"flex",flexDirection:"column",gap:10,paddingBottom:28}}>
          {filtered.length===0?(
            <div style={{textAlign:"center",padding:"48px 20px",color:"#9B8B7A"}}>
              <div style={{fontSize:40,marginBottom:12}}>🍷</div>
              <div style={{fontSize:16,fontWeight:600,marginBottom:6,color:"#6B5E52"}}>No happy hours found</div>
              <div style={{fontSize:13}}>Try a different day, region, or filter.</div>
            </div>
          ):grouped?Object.entries(grouped).map(([rid,lsts])=>{
            const rg=REGIONS.find(r=>r.id===rid);
            return <div key={rid}>
              <div style={{display:"flex",alignItems:"center",gap:8,padding:"14px 0 8px",borderBottom:"2px solid #E8DFD4",marginBottom:10}}>
                <span style={{fontSize:18}}>{rg?.emoji}</span>
                <span style={{fontSize:15,fontWeight:700,color:"#3D2B1F"}}>{rg?.name}</span>
                <span style={{fontSize:11,color:"#9B8B7A",fontWeight:500,marginLeft:"auto"}}>{lsts.length} spot{lsts.length!==1?"s":""}</span>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:8}}>
                {lsts.map(l=><ListingCard key={l.id} listing={l} isToday={activeDay===TODAY}/>)}
              </div>
            </div>;
          }):(filtered.map(l=><ListingCard key={l.id} listing={l} isToday={activeDay===TODAY}/>))}
        </div>

        {/* Submit CTA */}
        <div style={{background:"linear-gradient(135deg,#3D2B1F,#5C3D2E)",borderRadius:14,padding:"28px 24px",textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:22,marginBottom:8}}>📍</div>
          <h3 style={{color:"#F5EDE3",fontSize:18,fontWeight:700,margin:"0 0 8px 0"}}>Own a spot in Northern Michigan?</h3>
          <p style={{color:"#BBA88E",fontSize:13,margin:"0 0 16px 0",lineHeight:1.5}}>List your happy hour for free. We cover TC, Leelanau,<br/>Benzie, Charlevoix, Petoskey, Mackinac, and beyond.</p>
          <button onClick={()=>setShowSubmitModal(true)} style={{padding:"12px 28px",borderRadius:8,border:"none",background:"linear-gradient(135deg,#C4895C,#D4A574)",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer",boxShadow:"0 4px 12px rgba(196,137,92,0.3)"}}>Submit Your Happy Hour</button>
        </div>

        {/* Browse by region */}
        <div style={{background:"#fff",borderRadius:14,padding:"20px",marginBottom:32,border:"1px solid #E8DFD4"}}>
          <div style={{fontSize:13,fontWeight:700,color:"#3D2B1F",marginBottom:12}}>Browse by Region</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {REGIONS.filter(r=>r.id!=="all").map(r=>(
              <button key={r.id} onClick={()=>{setRegion(r.id);window.scrollTo({top:0,behavior:"smooth"});}} style={{padding:"6px 12px",borderRadius:20,border:"1px solid #E8DFD4",background:"#FAF7F2",fontSize:11,color:"#6B5E52",cursor:"pointer",fontWeight:500}}>
                {r.emoji} {r.name}
              </button>
            ))}
          </div>
        </div>

        {/* Footer */}
        <footer style={{borderTop:"1px solid #E8DFD4",padding:"24px 0 40px",textAlign:"center"}}>
          <div style={{fontSize:13,fontWeight:700,color:"#7B4F3A",marginBottom:4}}>Northern Michigan Happy Hour Guide</div>
          <div style={{fontSize:11,color:"#9B8B7A",lineHeight:1.8}}>
            A companion to <a href="https://traversecitywinetour.com" style={{color:"#C4895C",fontWeight:600,textDecoration:"none"}}>Traverse City Wine Tour</a>
            <br/>Specials verified weekly · Last updated March 2026
            <br/><span style={{fontSize:10}}>Hours and deals may change — call ahead to confirm</span>
            <br/><span style={{fontSize:10,marginTop:8,display:"inline-block"}}>© 2026 Traverse City Wine Tour. All rights reserved.</span>
          </div>
        </footer>
      </main>

      {/* Submit Modal */}
      {showSubmitModal && (
        <div onClick={()=>setShowSubmitModal(false)} style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:"32px 28px",maxWidth:480,width:"100%",maxHeight:"80vh",overflow:"auto"}}>
            <h3 style={{fontSize:20,fontWeight:700,color:"#3D2B1F",marginBottom:4}}>Submit Your Happy Hour</h3>
            <p style={{fontSize:13,color:"#9B8B7A",marginBottom:20,lineHeight:1.5}}>We'll verify the details and add your listing within 48 hours.</p>
            {["Restaurant / Bar Name","Town / City","Address","Happy Hour Days & Times","Deals & Specials","Contact Email","Phone Number"].map((label,i) => (
              <div key={i} style={{marginBottom:12}}>
                <label style={{fontSize:11,fontWeight:600,color:"#6B5E52",display:"block",marginBottom:4}}>{label}</label>
                {label==="Deals & Specials"?
                  <textarea rows={3} placeholder={`e.g. $5 wines, half-off apps...`} style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #E8DFD4",fontSize:13,resize:"vertical",outline:"none",background:"#FAF7F2",boxSizing:"border-box"}}/>:
                  <input type={label.includes("Email")?"email":"text"} placeholder={label} style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"1.5px solid #E8DFD4",fontSize:13,outline:"none",background:"#FAF7F2",boxSizing:"border-box"}}/>
                }
              </div>
            ))}
            <div style={{display:"flex",gap:10,marginTop:20}}>
              <button onClick={()=>setShowSubmitModal(false)} style={{flex:1,padding:"12px",borderRadius:8,border:"1.5px solid #E8DFD4",background:"transparent",color:"#6B5E52",fontWeight:600,fontSize:13,cursor:"pointer"}}>Cancel</button>
              <button onClick={()=>{alert("Thank you! We'll review and add your listing within 48 hours.");setShowSubmitModal(false);}} style={{flex:1,padding:"12px",borderRadius:8,border:"none",background:"linear-gradient(135deg,#7B4F3A,#C4895C)",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>Submit</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
